[project]
name = "test-task-payment-service"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "Arondondon", email = "andreypravdin52@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "dishka>=1.10.1",
    "fastapi>=0.143.0",
    "faststream[rabbit]<0.7.0",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "testcontainers>=4.15.0",
]

# ================= MYPY =================
[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
exclude = ["alembic/", ".venv/", "venv/"]
plugins = [
    "pydantic.mypy"
]
namespace_packages = true
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ================= RUFF =================
[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py313"

exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "alembic",
    "build",
    "dist",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "PIE",
    "ARG",
    "PTH",
    "RUF",
    "PERF",
]
ignore = []
fixable = ["ALL"]
